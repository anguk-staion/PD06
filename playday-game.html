<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>PLAYDAY — SKY STRIKER</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#0B2C4E; }
  body{
    font-family:ui-monospace,'Consolas','Menlo','D2Coding',monospace;
    color:#EAF6FD; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; touch-action:none; cursor:crosshair;
  }
  canvas{ display:block; width:100%; height:100%; }

  #scan{
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.4;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }

  /* ── HUD : 멀리서도 읽히도록 큼직하게 ── */
  .hud{
    position:fixed; z-index:3; pointer-events:none;
    font-weight:800; letter-spacing:1px; line-height:1.4;
    text-shadow:
       2px  2px 0 rgba(2,14,28,.95), -2px  2px 0 rgba(2,14,28,.95),
       2px -2px 0 rgba(2,14,28,.95), -2px -2px 0 rgba(2,14,28,.95),
       0 0 14px rgba(2,14,28,.8);
  }
  #hudTop{ top:16px; left:0; right:0; display:flex; justify-content:space-around; align-items:baseline; padding:0 22px; gap:14px; }
  #hudBot{ bottom:16px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 22px; }
  .cell{ display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .side{ display:flex; flex-direction:column; gap:6px; }
  .side.r{ align-items:flex-end; }
  .k{ color:#9CCDE9; font-weight:600; font-size:14px; letter-spacing:2px; }
  .v{ color:#FFF3C4; font-size:30px; letter-spacing:2px; }
  .v.st{ color:#FF9E45; }
  .v.hi{ color:#8FE8B4; }
  #hudBot .v{ font-size:28px; }
  .gauge{
    display:block; width:132px; height:16px; align-self:center;
    background:rgba(3,20,38,.8); border:2px solid rgba(180,225,250,.8);
    box-shadow:0 0 8px rgba(2,14,28,.8);
  }
  .gauge i{ display:block; height:100%; width:20%; background:linear-gradient(to right,#18D76B,#B9F24D,#FFE066); transition:width .18s; }
  .lives{ color:#18D76B; font-size:30px; letter-spacing:5px; text-shadow:0 0 12px rgba(24,215,107,.85), 2px 2px 0 rgba(2,14,28,.95); }
  .lives.none{ color:#8FB0C4; text-shadow:2px 2px 0 rgba(2,14,28,.95); }
  .coin{ font-size:16px; letter-spacing:2px; color:#FFE066; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 0%,54%{ opacity:1; } 55%,100%{ opacity:0; } }

  #overlay{
    position:fixed; inset:0; z-index:4; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(2,16,34,.72); text-align:center; padding:24px;
  }
  #overlay.hide{ display:none; }
  #overlay .pilot{
    width:132px; height:auto; image-rendering:pixelated;
    border:1px solid rgba(126,196,236,.4); box-shadow:0 8px 30px rgba(2,14,28,.6);
  }
  #title{ font-size:38px; font-weight:800; letter-spacing:7px; text-shadow:0 0 22px rgba(24,215,107,.55); }
  #sub{ font-size:14px; color:#9CCDE9; letter-spacing:1.5px; line-height:2.1; }
  #sub b{ color:#FFE066; font-weight:700; }
  #final{ font-size:18px; color:#FFF3C4; letter-spacing:2px; line-height:1.9; }
  #go{
    pointer-events:auto; cursor:pointer;
    font-family:inherit; font-size:16px; font-weight:800; letter-spacing:2px;
    color:#04120D; background:#18D76B; border:2px solid #8FE8B4;
    padding:16px 34px; box-shadow:0 6px 0 #0F7A41;
  }
  #go:active{ transform:translateY(3px); box-shadow:0 3px 0 #0F7A41; }
  @media (max-width:700px){
    #title{ font-size:26px; letter-spacing:3px; }
    .v{ font-size:22px; } #hudBot .v{ font-size:21px; }
    .lives{ font-size:22px; letter-spacing:3px; }
    .k{ font-size:12px; } .gauge{ width:100px; height:13px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="scan"></div>

<div class="hud" id="hudTop">
  <div class="cell"><span class="k">1P</span><span class="v" id="score">000000</span></div>
  <div class="cell"><span class="k">HI</span><span class="v hi" id="hi">010000</span></div>
  <div class="cell"><span class="k">STAGE</span><span class="v st" id="stage">1-1</span></div>
</div>

<div class="hud" id="hudBot">
  <div class="side">
    <div class="cell"><span class="k">POWER</span><span class="v" id="plv">Lv1</span></div>
    <div class="cell"><span class="gauge"><i id="pbar"></i></span></div>
    <div class="cell"><span class="k">BOMB</span><span class="v" id="bomb">2</span></div>
  </div>
  <div class="side r">
    <div class="cell"><span class="k">LIVES</span><span class="lives" id="lives">▲▲▲</span></div>
    <div class="cell"><span class="k">CREDIT</span><span class="v" id="credit">00</span></div>
    <div class="cell"><span class="coin" id="coin">INSERT COIN</span></div>
  </div>
</div>

  /* ───────── 적기 종류 ─────────
     e1 소형 전투기 · e2 위장 대형기 · e3 전익 폭격기(미사일) · e4 제트 전투기(미사일) */
  var KIND={
    e1:{ w:68,  hp:1, score:100, hx:30, hy:28, vy:1.5, fire:'aim'     },
    e2:{ w:124, hp:4, score:500, hx:56, hy:50, vy:0.9, fire:'spread'  },

  };

  /* ───────── 스프라이트 : 표시 크기의 2배로 미리 축소해 캐싱 ───────── */
  var SPR={}, bgImg=null, bgRatio=0.558;
  function loadSprite(key,src,deg,w){
    var im=new Image();
    im.onload=function(){
      var h=Math.round(w*im.height/im.width);
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var g=c.getContext('2d');
      g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
      g.translate(w/2,h/2); g.rotate(deg*Math.PI/180);
      g.drawImage(im,-w/2,-h/2,w,h);
      SPR[key]={ c:c, r:im.height/im.width };
    };
    im.src=src;
  }
  loadSprite('me', SRC.me, 0,   164);   /* 표시 82px */
  loadSprite('e1', SRC.e1, 180, 136);
  loadSprite('e2', SRC.e2, 180, 248);
  loadSprite('e3', SRC.e3, 180, 300);
  loadSprite('e4', SRC.e4, 180, 172);
  loadSprite('bs', SRC.bs, 180, 620);   /* 보스 표시 최대 310px */
  (function(){ var im=new Image(); im.onload=function(){ bgImg=im; bgRatio=im.height/im.width; }; im.src=SRC.bg; })();

  function blit(key,x,y,w){
    var s=SPR[key]; if(!s) return 0;
    var h=w*s.r;
    ctx.drawImage(s.c, Math.round(x-w/2), Math.round(y-h/2), Math.round(w), Math.round(h));
    return h;
  }
  function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cvs.width=W*DPR; cvs.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(!player.x){ player.x=player.tx=W/2; player.y=player.ty=H*0.78; }
    player.tx=Math.min(player.tx,W-20); player.ty=Math.min(player.ty,H-20);
  }
  window.addEventListener('resize', resize);

  for(var i=0;i<90;i++) waves.push({ x:Math.random(), y:Math.random(), w:6+Math.random()*26,

  /* ───────── 난이도 ───────── */
  function stageNo(){ return Math.floor(score/2500); }
  function stageLabel(){ var n=stageNo(); return (1+Math.floor(n/4))+'-'+(1+(n%4)); }
  function spawnEvery(){ return Math.max(15, 34-stageNo()*2); }
  function enemyCap(){ return Math.min(18, 10+stageNo()); }
  function bulletSpeed(){ return 2.4+stageNo()*0.07; }

  /* ───────── 적탄 ─────────
     shot   둥근 탄     — e1 겨냥탄 / e2 확산탄
     missile 미사일     — e3 · e4, 처음엔 유도되다 가속해 직진
     tracer 기관총 예광탄 — 보스 전용, 가늘고 빠른 연사 */
  function pushEB(o){ if(!o.type) o.type='shot'; ebullets.push(o); }
  function trimEB(){ if(ebullets.length>260) ebullets.splice(0, ebullets.length-260); }
  function fireAimed(x,y,count,spread){
    var sp=bulletSpeed(), base=Math.atan2(player.y-y, player.x-x), a0=base-spread*(count-1)/2;
    for(var i=0;i<count;i++){ var a=a0+spread*i; pushEB({ x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp }); }
  }
  function fireRing(x,y,count){
    var sp=bulletSpeed()*0.85, off=(t%360)*0.017;
    for(var i=0;i<count;i++){ var a=Math.PI*2*i/count+off; pushEB({ x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp }); }
  }
  function fireMissile(x,y){
    var dx=player.x-x, dy=player.y-y, d=Math.sqrt(dx*dx+dy*dy)||1, sp=1.4;
    pushEB({ x:x, y:y, vx:dx/d*sp, vy:dy/d*sp, type:'missile', age:0 });
  }
  function ebRadius(eb){ return eb.type==='missile' ? 9 : eb.type==='tracer' ? 5 : 7; }
  function drawEB(eb){
    if(eb.type==='tracer'){
      ctx.save(); ctx.translate(eb.x,eb.y); ctx.rotate(Math.atan2(eb.vy,eb.vx));
      ctx.fillStyle='rgba(255,214,90,.55)'; ctx.fillRect(-16,-3,32,6);
      ctx.fillStyle='#FFF7DA';              ctx.fillRect(-10,-1.3,22,2.6);
      ctx.restore(); return;
    }
    if(eb.type==='missile'){
      ctx.save(); ctx.translate(eb.x,eb.y); ctx.rotate(Math.atan2(eb.vy,eb.vx));
      var f=7+Math.random()*11;
      ctx.fillStyle='rgba(255,140,30,.8)';  ctx.fillRect(-11-f,-3,f,6);
      ctx.fillStyle='rgba(255,244,200,.95)';ctx.fillRect(-11-f*.5,-1.5,f*.5,3);
      ctx.fillStyle='#C9D2D8'; ctx.fillRect(-11,-4,19,8);
      ctx.fillStyle='#8B969E'; ctx.fillRect(-11,-4,6,8);
      ctx.fillStyle='#E8433A';
      ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(15,0); ctx.lineTo(8,4); ctx.closePath(); ctx.fill();
      ctx.restore(); return;
    }
    ctx.beginPath(); ctx.arc(eb.x,eb.y,5.5,0,6.2832); ctx.fillStyle='#FF6A1E'; ctx.fill();
    ctx.beginPath(); ctx.arc(eb.x,eb.y,2.4,0,6.2832); ctx.fillStyle='#FFEDBA'; ctx.fill();
  }

  /* ───────── 적기 ───────── */
  var patCount=0;
  function pickKind(){
    var n=stageNo(), r=Math.random();
    if(n>=3 && r<0.10) return 'e3';
    if(n>=2 && r<0.22) return 'e4';
    if(r<0.40) return 'e2';
    return 'e1';
  }
  function spawnEnemy(){
    var k=pickKind(), K=KIND[k], boost=1+stageNo()*0.06;
    enemies.push({ k:k, x:60+Math.random()*(W-120), y:-K.w*0.6,
                   vy:(K.vy+Math.random()*0.8)*boost, amp:Math.random()*1.6, ph:Math.random()*6.28,
                   hp:K.hp, pat:(k==='e2'? patCount++%2 : 0),
                   fc: k==='e2' ? 45+Math.random()*45
                     : k==='e1' ? 80+Math.random()*90
                     : 70+Math.random()*60 });
  }
  function drawEnemy(e){
    var K=KIND[e.k];
    if(SPR[e.k]){ blit(e.k, e.x, e.y, K.w); return; }
    px(e.x-K.hx, e.y-K.hy, K.hx*2, K.hy*2, e.k==='e1'?'#6FBF95':'#8FA3B0');
  }
  function enemyFire(e){
    var K=KIND[e.k];
    if(K.fire==='aim'){
      e.fc=Math.max(60,150-stageNo()*8)+Math.random()*70;
      fireAimed(e.x, e.y+10, 1, 0);
    }else if(K.fire==='spread'){
      e.fc=Math.max(38,85-stageNo()*5)+Math.random()*35;
      if(e.pat===0) fireAimed(e.x, e.y+14, 3, 0.22); else fireRing(e.x, e.y+14, 10+Math.min(6,stageNo()));
      e.pat=1-e.pat;
    }else{                                   /* 미사일 — 양 날개에서 두 발 */
      e.fc=Math.max(70,140-stageNo()*6)+Math.random()*50;
      var off=K.w*0.30;
      fireMissile(e.x-off, e.y+K.w*0.12);
      fireMissile(e.x+off, e.y+K.w*0.12);
    }
    trimEB();
  }
  function drawItem(it){
    var on=(t%26)<13;
    var base=it.kind==='P' ? (on?'#18D76B':'#0D7A40') : (on?'#FF9E45':'#9E5417');
    px(it.x-13,it.y-12,26,24,base);
    px(it.x-10,it.y-9,20,18,'#04141F');
    ctx.fillStyle=on?'#EAFBF2':base;
    ctx.font='bold 15px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.kind, it.x, it.y+1);
    ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  }
  function boom(x,y,n,col){
    for(var i=0;i<n;i++) parts.push({ x:x,y:y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,
                                      life:18+Math.random()*16, s:2+Math.random()*3, c:col });
    if(parts.length>340) parts.splice(0, parts.length-340);
  }

  /* ───────── 보스 : 기관총 연사 + 가끔 미사일 ───────── */
  function spawnBoss(){
    var w=Math.max(190, Math.min(310, W*0.40));
    var hp=70+stageNo()*12;              /* 너무 길게 끌면 연사에 갈려 죽는다 */
    boss={ x:W/2, y:-w*0.6, w:w, hp:hp, max:hp, vx:1.7, enter:true,
           fc:90, burst:0, bfc:0, mfc:150 };
  }
  function killBoss(){
    for(var i=0;i<10;i++)
      boom(boss.x+(Math.random()-.5)*boss.w, boss.y+(Math.random()-.5)*boss.w*0.6, 20, i%2?'#FFE066':'#FF6B4A');
    score+=5000; flash=28;
    items.push({ x:boss.x-46, y:boss.y, vy:1.2, kind:'P' });
    items.push({ x:boss.x+46, y:boss.y, vy:1.2, kind:'B' });
    boss=null;
  }
  function updateBoss(){
    if(!boss) return;
    var halfW=boss.w*0.45;
    if(boss.enter){
      boss.y+=2.2;
      if(boss.y>=H*0.20) boss.enter=false;
    }else{
      boss.x+=boss.vx;
      if(boss.x<halfW+8){ boss.x=halfW+8; boss.vx=-boss.vx; }
      if(boss.x>W-halfW-8){ boss.x=W-halfW-8; boss.vx=-boss.vx; }
      boss.y+=Math.sin(t/70)*0.35;

      /* 기관총 — 짧은 간격으로 예광탄을 쏟아붓는 연사 */
      if(boss.burst>0){
        if(--boss.bfc<=0){
          boss.bfc=4; boss.burst--;
          /* 총구는 안쪽 2문으로 시작하고, 후반 스테이지에서 바깥 2문이 더 열린다 */
          var mz = stageNo()>=4 ? [-boss.w*0.30,-boss.w*0.11,boss.w*0.11,boss.w*0.30]
                                : [-boss.w*0.11, boss.w*0.11];
          for(var m=0;m<mz.length;m++){
            var a=Math.PI/2+(Math.random()-0.5)*0.20;
            pushEB({ x:boss.x+mz[m], y:boss.y+boss.w*0.16,
                     vx:Math.cos(a)*5.6, vy:Math.sin(a)*5.6, type:'tracer' });
          }
        }
      }else if(--boss.fc<=0){
        boss.fc=Math.max(80,150-stageNo()*6);
        boss.burst=12+Math.min(10,Math.floor(stageNo()*1.5)); boss.bfc=0;
      }
      if(--boss.mfc<=0){
        boss.mfc=170+Math.random()*80;
        fireMissile(boss.x-boss.w*0.36, boss.y+boss.w*0.10);
        fireMissile(boss.x+boss.w*0.36, boss.y+boss.w*0.10);
      }
      trimEB();
    }

    for(var b=bullets.length-1;b>=0;b--){
      var bl=bullets[b];
      if(Math.abs(bl.x-boss.x)<boss.w*0.42 && Math.abs(bl.y-boss.y)<boss.w*0.34){
        bullets.splice(b,1); boss.hp--; boom(bl.x,bl.y,3,'#DFF7E9');
        if(boss.hp<=0){ killBoss(); return; }
      }
    }
    if(beam && boss.y<player.y && Math.abs(boss.x-beam.x)<beam.w/2+boss.w*0.30){
      boss.hp-=1.2;
      if(t%4===0) boom(boss.x+(Math.random()-.5)*boss.w*0.6, boss.y+(Math.random()-.5)*boss.w*0.3, 3, '#FFE066');
      if(boss.hp<=0){ killBoss(); return; }
    }
    if(mode==='play' && invuln===0 && !boss.enter &&
       Math.abs(boss.x-player.x)<boss.w*0.32 && Math.abs(boss.y-player.y)<boss.w*0.26) loseLife();
  }
  function drawBoss(){
    if(!boss) return;
    if(SPR.bs) blit('bs', boss.x, boss.y, boss.w);
    else px(boss.x-boss.w/2, boss.y-boss.w*0.3, boss.w, boss.w*0.6, '#7A6B3A');
    if(boss.enter) return;
    var bw=Math.min(440,W*0.62), bx=(W-bw)/2, by=72;
    px(bx-3,by-3,bw+6,18,'rgba(3,20,38,.8)');
    px(bx,by,bw*Math.max(0,boss.hp/boss.max),12,'#FF4E3A');
    ctx.font='bold 13px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.fillStyle='#FFE9A8'; ctx.fillText('BOSS', W/2, by-8); ctx.textAlign='start';
  }

  /* ───────── 플레이어 ───────── */
  var PATTERN=[
    [[0,0]],
    [[-10,0],[10,0]],
    [[-12,0],[0,0],[12,0]],
    [[-14,0],[-5,-.9],[5,.9],[14,0]],
    [[-16,0],[-7,-1.1],[0,0],[7,1.1],[16,0]]
  ];
  function shoot(){
    var pat=PATTERN[Math.min(pw,MAXLV)-1];
    for(var i=0;i<pat.length;i++) bullets.push({ x:player.x+pat[i][0], y:player.y-38, vx:pat[i][1] });
  }
  function drawPlayer(){
    var x=player.x, y=player.y;
    if(SPR.me){
      var h=blit('me', x, y, 82);
      if(t%8<4) px(x-6, y+h/2-6, 12, 9, 'rgba(255,206,90,.95)');
      return;
    }
    px(x-5,  y-36, 10, 66, '#DDE9E4');
    px(x-39, y-5,  78, 15, '#B4C7C0');
    px(x-23, y+23, 46, 11, '#B4C7C0');
    px(x-5,  y-20, 10, 15, '#18D76B');
    if(t%8<4) px(x-6, y+34, 12, 9, 'rgba(255,206,90,.95)');
  }

  /* 폭탄 = 기체 앞으로 뻗는 거대한 빔. 그 줄만 쓸어버린다. */
  function useBomb(){
    if(bombs<=0 || mode!=='play' || beam) return;
    bombs--; flash=10;
    beam={ x:player.x, w:140+pw*12, life:52, max:52 };
  }
  function updateBeam(){
    if(!beam) return;
    beam.x=player.x; beam.life--;
    var half=beam.w/2;
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i];
      if(e.y<player.y && Math.abs(e.x-beam.x)<half+KIND[e.k].hx){
        boom(e.x,e.y,18,'#FFE066'); score+=KIND[e.k].score; enemies.splice(i,1);
      }
    }
    for(var j=ebullets.length-1;j>=0;j--){
      var b=ebullets[j];
      if(b.y<player.y && Math.abs(b.x-beam.x)<half) ebullets.splice(j,1);
    }
    if(beam.life<=0) beam=null;
  }
  function drawBeam(){
    if(!beam) return;
    var k=beam.life/beam.max;
    var w=beam.w*(0.35+0.65*Math.min(1,k*3));
    var bot=player.y-6;
    var g=ctx.createLinearGradient(0,bot,0,0);
    g.addColorStop(0,   'rgba(223,247,233,'+(0.95*k)+')');
    g.addColorStop(0.45,'rgba(24,215,107,'+(0.70*k)+')');
    g.addColorStop(1,   'rgba(143,232,180,'+(0.12*k)+')');
    ctx.fillStyle=g; ctx.fillRect(beam.x-w/2, 0, w, bot);
    ctx.fillStyle='rgba(255,255,255,'+(0.85*k)+')';
    ctx.fillRect(beam.x-w*0.16, 0, w*0.32, bot);
    ctx.beginPath(); ctx.arc(beam.x, bot, w*0.42*(0.65+0.35*Math.sin(t*0.7)), 0, 6.2832);
    ctx.fillStyle='rgba(223,247,233,'+(0.55*k)+')'; ctx.fill();
  }

  /* 적탄이나 적기에 닿으면 무조건 목숨이 깎인다 (폭탄은 방어막이 아니다) */
  function loseLife(){
    boom(player.x,player.y,36,'#FFB347');
    boom(player.x,player.y,20,'#FF6B4A');
    lives--; invuln=150; flash=14;
    ebullets.length=0;
    if(pw>1) pw--;
    if(lives<=0){ lives=0; credit++; gameOver(); }
  }

  /* ───────── 상태 전환 ───────── */
  function reset(){
    score=0; pw=1; bombs=2; lives=LIVES0; nextUp=10000; nextBoss=8000;
    invuln=110; t=0; beam=null; boss=null;
    bullets.length=0; ebullets.length=0; enemies.length=0; items.length=0; parts.length=0;
    player.x=player.tx=W/2; player.y=player.ty=H*0.78;
  }
  function start(){ reset(); mode='play'; overlay.classList.add('hide'); }
  function gameOver(){
    mode='over';
    if(score>hi){ hi=score; try{ localStorage.setItem('playdayHi',hi); }catch(e){} }
    titleEl.textContent='GAME OVER';
    finalEl.innerHTML='SCORE '+('000000'+score).slice(-6)+'<br>HI-SCORE '+('000000'+hi).slice(-6);
    subEl.style.display='none';
    goBtn.textContent='다시 시작';
    overlay.classList.remove('hide');
  }
  goBtn.addEventListener('click', function(e){ e.stopPropagation(); start(); });
  overlay.addEventListener('click', function(){ start(); });

  /* ───────── 조작 ───────── */
  function movePointer(cx,cy){
    player.tx=Math.max(18, Math.min(W-18, cx));
    player.ty=Math.max(40, Math.min(H-24, cy));
  }
  window.addEventListener('pointermove', function(e){ movePointer(e.clientX,e.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(e.touches[0]){ movePointer(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, {passive:false});
  window.addEventListener('pointerdown', function(){ if(mode==='play') useBomb(); });
  var keys={};
  window.addEventListener('keydown', function(e){
    keys[e.key]=true;
    if(e.key===' '){ e.preventDefault(); if(mode==='play') useBomb(); else start(); }
  });
  window.addEventListener('keyup', function(e){ keys[e.key]=false; });
  function keyMove(){
    var sp=7,dx=0,dy=0;
    if(keys.ArrowLeft||keys.a||keys.A) dx-=sp;
    if(keys.ArrowRight||keys.d||keys.D) dx+=sp;
    if(keys.ArrowUp||keys.w||keys.W) dy-=sp;
    if(keys.ArrowDown||keys.s||keys.S) dy+=sp;
    if(dx||dy) movePointer(player.tx+dx, player.ty+dy);
  }

  /* ───────── 배경 : 한 장 걸러 상하 반전해 이음매 없이 무한 스크롤 ───────── */
  function drawBG(){
    if(!bgImg){ ctx.fillStyle='#0B2C4E'; ctx.fillRect(0,0,W,H); return; }
    var h=W*bgRatio;
    for(var n=Math.floor(-scrollY/h)-1; n*h+scrollY<H; n++){
      var y=n*h+scrollY;
      if(y+h<0) continue;
      if(((n%2)+2)%2===1){
        ctx.save(); ctx.translate(0,y+h); ctx.scale(1,-1);
        ctx.drawImage(bgImg,0,0,W,h); ctx.restore();
      }else ctx.drawImage(bgImg,0,y,W,h);
    }
    ctx.fillStyle='rgba(2,16,34,.30)'; ctx.fillRect(0,0,W,H);
  }

  /* ───────── 메인 루프 ───────── */
  function step(){
    t++;
    scrollY += (mode==='play' ? 1.5 : 0.6);
    drawBG();

    for(var w0=0;w0<waves.length;w0++){
      var wv=waves[w0]; wv.y+=wv.s/H*2.6;
      if(wv.y>1){ wv.y=-0.02; wv.x=Math.random(); }
      px(wv.x*W, wv.y*H, wv.w, 2, wv.br?'rgba(235,250,255,.22)':'rgba(200,232,252,.11)');
    }

    if(mode==='play'){
      if(invuln>0) invuln--;
      keyMove();
      player.x+=(player.tx-player.x)*0.2;
      player.y+=(player.ty-player.y)*0.2;
      if(invuln===0 || (t%8)<4) drawPlayer();
      if(--player.cool<=0){ shoot(); player.cool=Math.max(4,9-pw); }

      if(!boss && score>=nextBoss){ spawnBoss(); nextBoss+=15000; }
      var slot = boss ? Math.min(5, enemyCap()) : enemyCap();
      if(t % spawnEvery() === 0 && enemies.length < slot) spawnEnemy();
    }

    for(var b=bullets.length-1;b>=0;b--){
      var bl=bullets[b]; bl.y-=13; bl.x+=bl.vx;
      if(bl.y<-20){ bullets.splice(b,1); continue; }
      px(bl.x-2, bl.y, 4, 12, '#DFF7E9');
      px(bl.x-2, bl.y+3, 4, 9, '#18D76B');
    }

    if(mode==='play') updateBoss();
    drawBoss();

    for(var e0=enemies.length-1;e0>=0;e0--){
      var en=enemies[e0], K=KIND[en.k];
      en.y+=en.vy; en.x+=Math.sin((t+en.ph*30)/34)*en.amp;
      if(en.y>H+K.w){ enemies.splice(e0,1); continue; }
      drawEnemy(en);

      if(mode==='play' && en.y>0 && en.y<H*0.8 && --en.fc<=0) enemyFire(en);

      var killed=false;
      for(var b2=bullets.length-1;b2>=0;b2--){
        var bb=bullets[b2];
        if(Math.abs(bb.x-en.x)<K.hx && Math.abs(bb.y-en.y)<K.hy){
          bullets.splice(b2,1); en.hp--; boom(en.x,en.y,4,'#DFF7E9');
          if(en.hp<=0){
            boom(en.x,en.y, K.w>100?28:15, K.w>100?'#E6D050':'#18D76B');
            score+=K.score;
            if(en.k==='e2'||en.k==='e3'||en.k==='e4') items.push({ x:en.x,y:en.y,vy:1.2,kind:Math.random()<.35?'B':'P' });
            else if(Math.random()<.09) items.push({ x:en.x,y:en.y,vy:1.2,kind:'P' });
            enemies.splice(e0,1); killed=true;
          }
          break;
        }
      }
      if(killed) continue;
      /* 내 판정점은 조종석만큼만 — 그림은 커도 스치는 정도로는 안 죽는다 */
      if(mode==='play' && invuln===0 &&
         Math.abs(en.x-player.x)<K.hx*0.30 && Math.abs(en.y-player.y)<K.hy*0.30){ loseLife(); break; }
    }

    for(var q=ebullets.length-1;q>=0;q--){
      var eb=ebullets[q];
      if(eb.type==='missile'){
        eb.age++;
        /* 처음 35프레임만 살짝 유도되고 그 뒤엔 직진 — 옆으로 피할 수 있어야 한다 */
        if(eb.age<35){
          var dx=player.x-eb.x, dy=player.y-eb.y, d=Math.sqrt(dx*dx+dy*dy)||1;
          eb.vx+=dx/d*0.12; eb.vy+=dy/d*0.12;
        }
        var sp=Math.sqrt(eb.vx*eb.vx+eb.vy*eb.vy);
        if(sp>4.2){ eb.vx=eb.vx/sp*4.2; eb.vy=eb.vy/sp*4.2; }
      }
      eb.x+=eb.vx; eb.y+=eb.vy;
      if(eb.y>H+40||eb.y<-40||eb.x<-40||eb.x>W+40){ ebullets.splice(q,1); continue; }
      drawEB(eb);
      var r=ebRadius(eb);
      if(mode==='play' && invuln===0 &&
         Math.abs(eb.x-player.x)<r && Math.abs(eb.y-player.y)<r){ loseLife(); break; }
    }

    for(var i2=items.length-1;i2>=0;i2--){
      var it=items[i2];
      it.y+=it.vy; it.x+=Math.sin((t+i2*23)/38)*.7;
      if(it.y>H+30){ items.splice(i2,1); continue; }
      drawItem(it);
      if(mode==='play' && Math.abs(it.x-player.x)<38 && Math.abs(it.y-player.y)<38){
        if(it.kind==='P'){ if(pw<MAXLV) pw++; } else bombs=Math.min(bombs+1,5);
        score+=200; boom(it.x,it.y,12,'#FFE066'); items.splice(i2,1);
      }
    }

    if(mode==='play') updateBeam();
    drawBeam();

    for(var p=parts.length-1;p>=0;p--){
      var pt=parts[p];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=.07; pt.life--;
      if(pt.life<=0){ parts.splice(p,1); continue; }
      ctx.globalAlpha=Math.max(0,pt.life/30);
      px(pt.x,pt.y,pt.s,pt.s,pt.c);
      ctx.globalAlpha=1;
    }

    if(flash>0){ flash--; ctx.fillStyle='rgba(255,242,200,'+(flash/44)+')'; ctx.fillRect(0,0,W,H); }

    if(mode==='play' && score>=nextUp){
      nextUp+=10000;
      if(lives<MAXLIVES){ lives++; boom(player.x,player.y,18,'#8FE8B4'); }
    }

    if(t%6===0){
      if(score>hi){ hi=score; try{ localStorage.setItem('playdayHi',hi); }catch(e){} }
      scoreEl.textContent=('000000'+score).slice(-6);
      hiEl.textContent=('000000'+hi).slice(-6);
      stageEl.textContent=stageLabel();
      plvEl.textContent='Lv'+pw;
      pbarEl.style.width=(pw/MAXLV*100)+'%';
      bombEl.textContent=bombs;
      livesEl.textContent = lives ? new Array(lives+1).join('▲') : '—';
      livesEl.className = lives ? 'lives' : 'lives none';
      creditEl.textContent=('0'+credit).slice(-2);
      coinEl.textContent = mode==='over' ? 'GAME OVER' : 'INSERT COIN';
    }
    raf=requestAnimationFrame(step);
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && raf){ cancelAnimationFrame(raf); raf=null; }
    else if(!document.hidden && !raf){ raf=requestAnimationFrame(step); }
  });

  resize();
  raf=requestAnimationFrame(step);
})();
</script>
</body>
</html>
